<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{{ site_nome }}{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:{{ cor_cream_light }};font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:{{ cor_cream_light }};">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">

          <!-- Faixa Brasil -->
          <tr>
            <td style="font-size:0;line-height:0;border-radius:12px 12px 0 0;overflow:hidden;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="33.33%" height="4" style="background-color:{{ cor_green }};font-size:0;line-height:0;">&nbsp;</td>
                  <td width="33.33%" height="4" style="background-color:{{ cor_yellow }};font-size:0;line-height:0;">&nbsp;</td>
                  <td width="33.34%" height="4" style="background-color:{{ cor_blue }};font-size:0;line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Cabeçalho -->
          <tr>
            <td align="center" style="background-color:{{ cor_cream }};padding:28px 24px 24px;border-left:1px solid {{ cor_border }};border-right:1px solid {{ cor_border }};">
              <a href="{{ site_url }}" style="text-decoration:none;">
                <img src="{{ logo_url }}" alt="{{ site_nome }}" width="88" height="88" style="display:block;width:88px;height:88px;border-radius:50%;border:3px solid {{ cor_green }};margin:0 auto 12px;">
              </a>
              <p style="margin:0;font-size:26px;font-weight:bold;letter-spacing:0.06em;color:{{ cor_brown }};font-family:Arial,Helvetica,sans-serif;text-transform:uppercase;">
                {{ site_nome }}
              </p>
              <p style="margin:6px 0 0;font-size:13px;color:{{ cor_brown_muted }};font-style:italic;">
                {{ site_tagline }}
              </p>
            </td>
          </tr>

          <!-- Conteúdo -->
          <tr>
            <td style="background-color:{{ cor_card }};padding:32px 28px;border-left:1px solid {{ cor_border }};border-right:1px solid {{ cor_border }};color:{{ cor_brown }};font-size:16px;line-height:1.65;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Rodapé -->
          <tr>
            <td align="center" style="background-color:{{ cor_brown }};padding:20px 24px;border-radius:0 0 12px 12px;border:1px solid {{ cor_brown }};">
              <p style="margin:0 0 8px;font-size:13px;color:{{ cor_cream }};line-height:1.5;">
                {% block footer_note %}Com respeito ao nosso samba{% endblock %}
              </p>
              {% if site_url %}
              <a href="{{ site_url }}" style="font-size:13px;color:{{ cor_yellow }};text-decoration:none;font-weight:bold;">{{ site_url }}</a>
              {% endif %}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
