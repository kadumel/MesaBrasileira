{% load static %}
<figure
  class="roda-item roda-item--{{ kind }}{% if href %} roda-item--link{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"
  data-roda-item
  data-kind="{{ kind }}"
  data-order="{{ order }}"
  data-depth="{{ depth }}"
  style="--x: {{ x }}; --y: {{ y }}; --s: {{ s }}; --rot: {{ rot }}; --flip: {{ flip|default:'1' }}; --z: {{ z }}; --w: {{ w }};"
>
  <div class="roda-item-slot">
    <div class="roda-item-motion">
      <div class="roda-item-parallax">
        {% if href %}
        <a href="{{ href }}" class="roda-item-link" aria-label="{{ caption|default:page_name }} — ir para {{ page_name }}">
          <span class="roda-item-tip">{{ page_name }}</span>
          <img
            src="{% static src %}{% if cache %}?v={{ cache }}{% endif %}"
            alt="{{ alt }}"
            width="{{ iw }}"
            height="{{ ih }}"
            decoding="async"
          >
          {% if caption %}
          <span class="roda-item-caption">{{ caption }}</span>
          {% endif %}
        </a>
        {% else %}
        <img
          src="{% static src %}{% if cache %}?v={{ cache }}{% endif %}"
          alt="{{ alt }}"
          width="{{ iw }}"
          height="{{ ih }}"
          decoding="async"
        >
        {% if caption %}
        <span class="roda-item-caption">{{ caption }}</span>
        {% endif %}
        {% endif %}
      </div>
    </div>
  </div>
</figure>
