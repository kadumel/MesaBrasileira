{# Player oficial Instagram — requer embed.js na página #}
<div class="instagram-embed-container">
  <blockquote
    class="instagram-media"
    data-instgrm-permalink="{{ permalink }}"
    data-instgrm-version="14"
    style="background:#FFF; border:0; border-radius:12px; box-shadow:0 4px 24px rgba(75,54,33,0.12); margin:0; max-width:100%; min-width:280px; padding:0; width:100%;"
  >
    <a href="{{ permalink }}" target="_blank" rel="noopener">Ver no Instagram</a>
  </blockquote>
</div>
